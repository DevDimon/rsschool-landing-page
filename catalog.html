<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Resource Coffee House — меню кофе, чая и десертов.">
    <title>Resource — Menu</title>
    <link rel="icon" type="image/svg+xml" href="images/coffee-cup-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..700;1,14..32,400..700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script>
        (function () {
            try {
                var t = localStorage.getItem('theme');
                if (t !== 'light' && t !== 'dark') t = 'light';
                document.documentElement.setAttribute('data-theme', t);
            } catch (e) { }
        })();
    </script>
</head>

<body>
    <a class="skip-link" href="#main">Перейти к содержимому</a>

    <!-- ============ HEADER ============ -->
    <header class="header">
        <div class="container header__inner">
            <a class="logo" href="index.html" aria-label="Resource Coffee House — на главную">
                <img class="logo__img logo__img--light" src="images/logo.png" alt="Resource Coffee House" width="150"
                    height="62">
                <img class="logo__img logo__img--dark" src="images/logo-dark.png" alt="" width="150" height="62"
                    aria-hidden="true">
            </a>

            <nav class="nav" aria-label="Основная навигация">
                <ul class="nav__list">
                    <li><a class="nav__link" href="index.html#favorite">Favorite coffee</a></li>
                    <li><a class="nav__link" href="index.html#about">About</a></li>
                    <li><a class="nav__link" href="index.html#mobile">Mobile app</a></li>
                    <li><a class="nav__link" href="index.html#contact">Contact us</a></li>
                </ul>
            </nav>

            <div class="header__actions">
                <button class="theme-toggle" type="button" data-theme-toggle aria-label="Переключить тему"
                    aria-pressed="false">
                    <span class="theme-toggle__icon theme-toggle__icon--sun">
                        <img src="images/Sun-icon.png" alt="" width="16" height="16">
                    </span>
                    <span class="theme-toggle__icon theme-toggle__icon--moon">
                        <img src="images/Moon-icon.png" alt="" width="16" height="16">
                    </span>
                </button>

                <a class="menu-btn" href="catalog.html">
                    <span>Menu</span>
                    <img class="menu-btn__icon" src="images/coffee-cup-icon.png" alt="" width="20" height="20">
                </a>

                <button class="burger" type="button" data-burger aria-label="Открыть меню" aria-expanded="false"
                    aria-controls="mobile-menu">
                    <span></span><span></span><span></span>
                </button>
            </div>
        </div>

        <div class="mobile-menu" id="mobile-menu" data-mobile-menu hidden>
            <ul class="mobile-menu__list">
                <li><a href="index.html#favorite">Favorite coffee</a></li>
                <li><a href="index.html#about">About</a></li>
                <li><a href="index.html#mobile">Mobile app</a></li>
                <li><a href="index.html#contact">Contact us</a></li>
                <li><a href="catalog.html">Menu</a></li>
            </ul>
        </div>
    </header>
</body>

</html>
